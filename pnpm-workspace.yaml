packages:
  - packages/*
  - examples/bt-bot

minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
saveExact: true
# pnpm 11: onlyBuiltDependencies → allowBuilds (strictDepBuilds defaults to true)
allowBuilds:
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
minimumReleaseAgeExclude:
  # Renovate security update: happy-dom@20.8.9
  - happy-dom@20.8.9
  # Renovate security update: vitest@3.2.6
  - vitest@3.2.6
